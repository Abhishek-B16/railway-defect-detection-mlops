services:
  - type: web
    name: railguard-api
    env: docker
    plan: free
    dockerfilePath: Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: MLFLOW_TRACKING_URI
        value: https://dagshub.com/Abhishek-B16/railway-defect-detection-mlops.mlflow
      - key: MLFLOW_MODEL_NAME
        value: RailGuard-Detector
      - key: MLFLOW_MODEL_ALIAS
        value: candidate
      - key: MLFLOW_MODEL_VERSION
        value: "1"
      - key: MLFLOW_MODEL_RUN_ID
        value: "80842181f7e345bb85b961dc2fdcfd3c"

  - type: web
    name: railguard-ui
    env: docker
    plan: free
    dockerfilePath: Dockerfile.ui
    envVars:
      - key: API_URL
        fromService:
          type: web
          name: railguard-api
          envVarKey: RENDER_EXTERNAL_URL